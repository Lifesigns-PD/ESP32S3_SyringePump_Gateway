; PlatformIO project: Injectomat Agilia decoder + JSON uploader + OTA, native ESP-IDF (no Arduino)
; ESP32-S3-WROOM-1U (N4 / N8 / N8R2 / N16). Pick the environment that matches the flash size of your module.
;
;   wroom1u_4mb   4 MB flash  - two OTA slots of 1.25 MB
;   wroom1u_8mb   8 MB flash  - two OTA slots of 3.2 MB   (Minew gateway, ESP32-S3-WROOM-1 N8R2)
;   wroom1u_16mb  16 MB flash - two OTA slots of 6.4 MB
;
; The firmware runs on any of them, but an 8 MB module built for 4 MB wastes half of its flash.

[platformio]
default_envs = wroom1u_8mb

[env]
platform      = espressif32@6.9.0
framework     = espidf
board         = esp32-s3-devkitc-1
monitor_speed = 115200
upload_speed  = 921600
board_build.f_cpu     = 240000000L
board_build.f_flash   = 80000000L
board_build.flash_mode = qio
; config.h: MODULE_PSRAM_OCTAL, pins, server ... (all settings are in src/config.h)

[env:wroom1u_4mb]
board_upload.flash_size = 4MB
board_build.partitions  = partitions_4mb.csv
build_flags = -DBUILD_FLASH_MB=4

[env:wroom1u_8mb]
board_upload.flash_size = 8MB
board_build.partitions  = partitions_8mb.csv
build_flags = -DBUILD_FLASH_MB=8

[env:wroom1u_16mb]
board_upload.flash_size = 16MB
board_build.partitions  = partitions_16mb.csv
build_flags = -DBUILD_FLASH_MB=16
